name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.compiler }} / Release
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenMP runtime for Clang
        if: matrix.compiler == 'clang'
        run: sudo apt-get update && sudo apt-get install -y libomp-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DRADAR_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke run
        run: |
          ./build/radar_sim --version
          ./build/radar_sim info scenarios/default.ini
          ./build/radar_sim run scenarios/default.ini -o out
          ./build/radar_sim montecarlo scenarios/monte_carlo.ini --trials 100 -o out
          test -s out/viewer.html && test -s out/range_doppler.ppm && test -s out/pd_curve.csv

  sanitizers:
    name: gcc / ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DRADAR_ENABLE_SANITIZERS=ON -DRADAR_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure
      - name: Sanitized run
        run: ./build/radar_sim run scenarios/default.ini --cpis 3 -o out

  no-openmp:
    name: gcc / single-threaded
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DRADAR_ENABLE_OPENMP=OFF -DRADAR_WARNINGS_AS_ERRORS=ON
      - name: Build and test
        run: cmake --build build -j && ctest --test-dir build --output-on-failure

  static-analysis:
    name: cppcheck + clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cppcheck clang-tidy libomp-dev
      - name: cppcheck
        run: |
          cppcheck --version
          cppcheck --enable=warning,style,performance,portability --std=c++17 --inline-suppr \
            --suppressions-list=.cppcheck-suppressions --error-exitcode=1 -q -I include src app
      - name: clang-tidy
        run: |
          cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++ -DRADAR_BUILD_TESTS=OFF
          clang-tidy --version
          run-clang-tidy -p build -quiet 'src/|app/'
