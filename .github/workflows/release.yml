name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Build static release binary
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRADAR_STATIC=ON
          cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          name=radar_sim-${GITHUB_REF_NAME}-${{ matrix.platform }}
          mkdir -p "$name/bin"
          cp build/radar_sim "$name/bin/"
          cp -r scenarios README.md LICENSE CHANGELOG.md "$name/"
          "$name/bin/radar_sim" --version
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: radar_sim-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum radar_sim-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[.*\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: |
            dist/radar_sim-*.tar.gz
            dist/SHA256SUMS
