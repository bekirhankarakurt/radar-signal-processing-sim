name: Bug report
description: Report incorrect results, crashes or build problems
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Command line and scenario file (or the relevant sections).
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Console output, error message or a description of the wrong result.
      render: text
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: radar_sim 1.0.0 / commit hash
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and compiler
      placeholder: Ubuntu 24.04, GCC 13.3, OpenMP on
