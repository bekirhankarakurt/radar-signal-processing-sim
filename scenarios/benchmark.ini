; Throughput benchmark: S-band long-range surveillance, 128 pulses x ~10k samples per CPI.
[simulation]
name = s-band-benchmark
cpis = 10
seed = 5
cpi_interval_s = 1.0

[radar]
carrier_hz = 3.0e9
bandwidth_hz = 10e6
pulse_width_s = 40e-6
prf_hz = 2e3
pulses = 128
sample_rate_hz = 12e6
peak_power_w = 200
antenna_gain_db = 36
noise_figure_db = 3
system_loss_db = 5
max_range_m = 60000

[processing]
range_window = taylor
doppler_window = taylor
mti = three_pulse
cfar = ca
cfar_pfa = 1e-6
guard_range = 4
guard_doppler = 2
train_range = 16
train_doppler = 6
clutter_notch_mps = 1.5

[clutter]
enabled = true
cnr_db = 35
min_range_m = 3000
max_range_m = 20000
spectral_width_mps = 0.3

[target]
range_m = 15000
velocity_mps = 30
rcs_m2 = 0.2
swerling = 1

[target]
range_m = 42000
velocity_mps = -42
rcs_m2 = 10

[target]
range_m = 55000
velocity_mps = -35
rcs_m2 = 20
swerling = 1
