; X-band pulse-Doppler surveillance radar: four targets over ground clutter.
[simulation]
name = x-band-surveillance
cpis = 8
seed = 2024
; one dwell every 0.5 s so that targets visibly move between CPIs
cpi_interval_s = 0.5

[radar]
carrier_hz = 9.5e9
bandwidth_hz = 5e6
pulse_width_s = 10e-6
prf_hz = 10e3
pulses = 64
sample_rate_hz = 10e6
peak_power_w = 400
antenna_gain_db = 32
noise_figure_db = 3
system_loss_db = 4
max_range_m = 12000

[processing]
range_window = taylor
range_window_taylor_nbar = 4
range_window_taylor_sll_db = -35
doppler_window = hamming
mti = three_pulse
cfar = ca
cfar_pfa = 1e-6
guard_range = 3
guard_doppler = 2
train_range = 10
train_doppler = 4

[clutter]
enabled = true
cnr_db = 25
min_range_m = 500
max_range_m = 5000
spectral_width_mps = 0.2

[tracker]
confirm_hits = 3
confirm_window = 4
max_misses = 2
range_gate_m = 60
velocity_gate_mps = 4

; Small multirotor UAV, closing
[target]
range_m = 2500
velocity_mps = 12
rcs_m2 = 0.02
swerling = 1

; Ground vehicle inside the clutter region
[target]
range_m = 4200
velocity_mps = -9
rcs_m2 = 5
swerling = 0

; Helicopter, opening
[target]
range_m = 6800
velocity_mps = -35
rcs_m2 = 3
swerling = 1

; Fast fixed-wing aircraft, closing
[target]
range_m = 10500
velocity_mps = 62
rcs_m2 = 4
swerling = 0
