; Detection-performance study: Pd vs SNR and empirical Pfa through the full chain.
; A compact radar keeps each trial cheap so thousands of trials run in seconds.
[simulation]
name = monte-carlo-sw1
seed = 7

[radar]
carrier_hz = 10e9
bandwidth_hz = 2e6
pulse_width_s = 10e-6
prf_hz = 20e3
pulses = 32
sample_rate_hz = 4e6
max_range_m = 3000

[processing]
range_window = taylor
doppler_window = hamming
mti = none
cfar = ca
cfar_pfa = 1e-4
guard_range = 2
guard_doppler = 1
train_range = 8
train_doppler = 3

[monte_carlo]
snr_min_db = 0
snr_max_db = 26
snr_step_db = 2
trials = 2000
pfa_trials = 400
swerling = 1
range_m = 1500
velocity_mps = 30
