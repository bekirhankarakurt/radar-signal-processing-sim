; Two aircraft flying in close formation: the strong echo sits in the CA-CFAR
; reference window of the weak one and masks it. OS-CFAR rejects the outlier.
; Compare:  radar_sim run scenarios/formation_os_cfar.ini --cfar ca
[simulation]
name = formation-os-cfar
cpis = 6
seed = 31
cpi_interval_s = 0.25

[radar]
carrier_hz = 9.5e9
bandwidth_hz = 5e6
pulse_width_s = 10e-6
prf_hz = 10e3
pulses = 64
sample_rate_hz = 10e6
peak_power_w = 400
antenna_gain_db = 32
noise_figure_db = 3
system_loss_db = 4
max_range_m = 12000

[processing]
range_window = taylor
doppler_window = hamming
mti = none
cfar = os
os_rank = 0.75
cfar_pfa = 1e-6
guard_range = 3
guard_doppler = 2
train_range = 10
train_doppler = 4

; Lead aircraft, large RCS
[target]
range_m = 8000
velocity_mps = 45
rcs_m2 = 4

; Wingman 105 m behind the lead (7 range bins), same speed, small RCS
[target]
range_m = 8105
velocity_mps = 45
rcs_m2 = 0.5
swerling = 1
